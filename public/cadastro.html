<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SET DOS DJs | Cadastro</title>

  <script src="./js/sessao.js"></script>
  <link rel="stylesheet" href="./css/header-footer.css">
  <link rel="stylesheet" href="./css/cadastro.css">
  <link rel="icon" href="./assets/imgs/thee/dj-icon.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>
  <div class="header">
    <div class="container">
      <img class="logo-header" src="./assets/imgs/thee/logo-set.png" alt="Logo">
      <ul class="navbar">
        <li><a href="index.html">História</a></li>
        <li><a href="cultura.html">Cultura</a></li>
        <li><a href="sobre.html">Sobre</a></li>
        <li><a href="cadastro.html">Cadastro</a></li>
      </ul>
    </div>
  </div>

  <main class="login-section">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>

    <div class="container-cadastro">
      <div class="form-area">
        <img class="titulo-cadastro" src="./assets/imgs/titulos/titulo-cadastro.png" alt="">
        <div class="formulario">
          <div class="preview-container">
            <label for="ipt_img_usuario">
              <img id="img_preview" src="./assets/icon/upload-icon.png" alt="Preview">
              <p class="legenda-foto">Sua foto</p>
            </label>
          </div>

          <input id="nome_input" type="text" placeholder="Nome completo" />
          <input id="dtNasc_input" type="date" placeholder="Data de Nascimento" />
          <input id="email_input" type="text" placeholder="E-mail: meuemail@provedor.com" />

          <input id="ipt_img_usuario" type="file" accept="image/*" style="display: none;"
            onchange="exibirPreview(event)" />
          <select id="estiloMusical_input" class="select-estilo">
            <option value="" disabled selected>Seu estilo musical favorito</option>

            <optgroup label="Música Eletrônica">
              <option value="Techno">Techno (Hard, Melodic, Peak Time)</option>
              <option value="House">House (Deep, Tech, Afro House)</option>
              <option value="EDM / Big Room">EDM / Big Room</option>
              <option value="Eletro / Electro House">Eletro / Electro House</option>
              <option value="Psytrance / Trance">Psytrance / Trance</option>
              <option value="Drum and Bass">Drum and Bass</option>
              <option value="Nu Disco / Indie Dance">Nu Disco / Indie Dance</option>
            </optgroup>

            <optgroup label="Cena Urbana & Funk">
              <option value="Funk Rave / Mandelão">Funk Rave / Mandelão</option>
              <option value="Funk Carioca / 150bpm">Funk Carioca / 150bpm</option>
              <option value="Trap / Hip Hop">Trap / Hip Hop</option>
              <option value="Reggaeton / Dancehall">Reggaeton / Dancehall</option>
            </optgroup>

            <optgroup label="Pop & Hits">
              <option value="Pop Nacional">Pop Nacional</option>
              <option value="Pop Internacional">Pop Internacional</option>
              <option value="Flashback (70s, 80s, 90s)">Flashback (70s, 80s, 90s)</option>
            </optgroup>

            <optgroup label="Brasilidades">
              <option value="Pagode / Samba">Pagode / Samba</option>
              <option value="Sertanejo Universitário">Sertanejo Universitário</option>
              <option value="Piseiro / Forró">Piseiro / Forró</option>
              <option value="Axé / Swingueira">Axé / Swingueira</option>
              <option value="MPB">MPB</option>
            </optgroup>

            <optgroup label="Rock & Alternativo">
              <option value="Rock (Clássico / Hard Rock)">Rock (Clássico / Hard Rock)</option>
              <option value="Indie Rock">Indie Rock</option>
              <option value="Punk / Hardcore">Punk / Hardcore</option>
              <option value="Metal">Metal</option>
              <option value="Reggae">Reggae</option>
            </optgroup>

            <option value="Outro">Outro</option>
          </select>
          <input id="senha_input" type="password" placeholder="Senha: ******" oninput="validarSenha()" />

          <div id="validacao_resumo" style="font-size: 13px; margin-top: 5px; text-align: left;">
            <span id="msg_tamanho" style="color: #808080;">✖ 8+ caracteres</span><br>
            <span id="msg_maiuscula" style="color: #808080;">✖ Uma letra maiúscula</span><br>
            <span id="msg_minuscula" style="color: #808080;">✖ Uma letra minúscula</span><br>
            <span id="msg_especial" style="color: #808080;">✖ Um caractere especial</span>
          </div>

          <input id="confirmacao_senha_input" type="password" placeholder="Confirmar senha: ******"
            oninput="validarSenha()" />
          <div id="msg_coincide" style="font-size: 13px; color: #808080;"></div>



          <button class="botao" onclick="cadastrar()">CADASTRAR</button>

        </div>

        <p class="link-login">Já tem cadastro? <a href="login.html">Faça login</a></p>
      </div>

      <div class="decoracao-area">
        <img src="./assets/imgs/thee/dj-icon.png" class="estrela-cad" alt="Estrela Decorativa">
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <img class="img-fotter" src="./assets/imgs/thee/set-estrela.png" alt="Logo Footer">
      <h4>&copy; 2026 Set dos DJ's – Esther Santos</h4>
      <div class="div-links">
        <div class="link-titulo">
          <img src="./assets/icon/pasta-icon.png" class="img-icon" alt="Pasta">
          <span>LINKS DE ACESSO</span>
        </div>
        <ul class="footer-list">
          <li><a href="index.html">HOME</a></li>
          <li><a href="interacoes.html">INTERAÇÕES</a></li>
          <li><a href="login.html">LOGIN</a></li>
          <li><a href="cadastro.html">CADASTRO</a></li>
        </ul>
      </div>
    </div>
  </footer>
</body>
</html>

<script>
  function validarSenha(){
    let senha = senha_input.value;
    let confirmacao = confirmacao_senha_input.value;

    let temTamanho = senha.length >= 8;
    let temMaiuscula = senha != senha.toLowerCase();
    let temMinuscula = senha != senha.toUpperCase();
    
    let especial = ['!', '@', '#', '$', '%', '&', '*', '~', ';', '.', ',', '/', '+', '-', '=', '|'];
    let temEspecial = false;

    for (let i = 0; i < especial.length; i++){
      if (senha.includes(especial[i])) {
        temEspecial = true;
      }
    }

    if (temTamanho){
      msg_tamanho.innerHTML = "✔ 8+ caracteres";
      msg_tamanho.style.color = "#32CD32";
    } else {
      msg_tamanho.innerHTML = "✖ 8+ caracteres";
      msg_tamanho.style.color = "#FF6347";
    }

    if (temMaiuscula){
      msg_maiuscula.innerHTML = "✔ Uma letra maiúscula";
      msg_maiuscula.style.color = "#32CD32";
    } else {
      msg_maiuscula.innerHTML = "✖ Uma letra maiúscula";
      msg_maiuscula.style.color = "#FF6347";
    }

    if (temMinuscula){
      msg_minuscula.innerHTML = "✔ Uma letra minúscula";
      msg_minuscula.style.color = "#32CD32";
    } else {
      msg_minuscula.innerHTML = "✖ Uma letra minúscula";
      msg_minuscula.style.color = "#FF6347";
    }

    if (temEspecial){
      msg_especial.innerHTML = "✔ Um caractere especial";
      msg_especial.style.color = "#32CD32";
    } else {
      msg_especial.innerHTML = "✖ Um caractere especial";
      msg_especial.style.color = "#FF6347";
    }

    if (senha == confirmacao && confirmacao.length > 0){
      msg_coincide.innerHTML = "✔ As senhas coincidem";
      msg_coincide.style.color = "#32CD32";
    } else if (confirmacao.length > 0){
      msg_coincide.innerHTML = "✖ As senhas não coincidem";
      msg_coincide.style.color = "#FF6347";
    } else {
      msg_coincide.innerHTML = "";
    }
  }

  function cadastrar(){
    let nomeVar = nome_input.value;
    let dtNascVar = dtNasc_input.value;
    let emailVar = email_input.value;
    let senhaVar = senha_input.value;
    let confirmacaoVar = confirmacao_senha_input.value;
    let estiloVar = estiloMusical_input.value;
    let foto = document.getElementById('ipt_img_usuario');

    if (nomeVar == "" || dtNascVar == "" || emailVar == "" || senhaVar == "" || confirmacaoVar == "" || estiloVar == ""){
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "Preencha todos os campos para prosseguir.";
      setInterval(sumirMensagem, 5000);
      return false;
    }

    if (!emailVar.includes('@') || !emailVar.includes('.')){
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "E-mail inválido! Deve conter '@' e '.'";
      setInterval(sumirMensagem, 5000);
      return false;
    }

    let especial = ['!', '@', '#', '$', '%', '&', '*', '~', ';', '.', ',', '/', '+', '-', '=', '|'];
    let temEspecial = false;
    for (let i = 0; i < especial.length; i++) {
      if (senhaVar.includes(especial[i])){ 
        temEspecial = true; 
      }
    }

    let temMaiuscula = senhaVar != senhaVar.toLowerCase();
    let temMinuscula = senhaVar != senhaVar.toUpperCase();

    if (senhaVar.length < 8 || !temMaiuscula || !temMinuscula || !temEspecial) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "A senha não atende aos requisitos de segurança.";
      setInterval(sumirMensagem, 5000);
      return false;
    }

    if (senhaVar != confirmacaoVar){
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "As senhas não coincidem!";
      setInterval(sumirMensagem, 5000);
      return false;
    }

    //Envio
    let formData = new FormData();
    formData.append("nomeServer", nomeVar);
    formData.append("dtNascServer", dtNascVar);
    formData.append("emailServer", emailVar);
    formData.append("senhaServer", senhaVar);
    formData.append("estiloServer", estiloVar);

    if (foto.files.length > 0){
      formData.append("fotoPerfil", foto.files[0]);
    }

 fetch("/usuarios/cadastrar", {
      method: "POST",
      body: formData
    })
      .then(resposta => {
        if (resposta.ok) {
          cardErro.style.display = "block";
          cardErro.style.backgroundColor = "#32CD32"; 
          mensagem_erro.innerHTML = "✔ Cadastro realizado com sucesso! Redirecionando...";
          
          setTimeout(() => {
            window.location = "login.html";
          }, 2000);

        } else {
          cardErro.style.display = "block";
          cardErro.style.backgroundColor = "#FF6347";
          mensagem_erro.innerHTML = "Erro ao realizar o cadastro. Verifique os dados.";
          
          setTimeout(sumirMensagem, 5000);
        }
      })
      .catch(erro => {
        console.error(`#ERRO: ${erro}`);
      });

    return false;
  }

  function exibirPreview(event){
    let input = event.target;
    let preview = document.getElementById('img_preview');
    if (input.files && input.files[0]) {
      let leitor = new FileReader();
      leitor.onload = function (e) { preview.src = e.target.result; };
      leitor.readAsDataURL(input.files[0]);
    }
  }


  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
