<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SET DOS DJs | Dashboard</title>

  <link rel="icon" href="../assets/imgs/thee/dj-icon.png">
  <link rel="stylesheet" href="../css/dashboard/dashboad-adm.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <aside class="barra-lateral">
    <div style="height: 50px;"></div>

    <a href="../dashboard/dashboard-adm.html" class="botao-menu">
      <img src="../assets/icon/dash-icon.png" alt="dash">
      DASH
    </a>

    <a href="../dashboard/perfil-adm.html" class="botao-menu">
      <img src="../assets/icon/perfil-icon.png" alt="perfil">
      PERFIL
    </a>

    <a href="../dashboard/visualizar-posts.html" class="botao-menu">
      <img src="../assets/icon/posts-icon.png" alt="perfil">
      POSTS
    </a>

    <div class="logout-container">
      <button class="botao-menu logout" onclick="limparSessao()">SAIR</button>
    </div>
  </aside>

  <main class="area-principal">

    <div class="topo">
      <div class="titulo">
        <h1>DASHBOARD</h1>
        <h2>Olá, <span id="b_usuario"></span>!</h2>
      </div>
      <div class="topo-direito">
        <div class="logo-topo">
          <img src="../assets/imgs/thee/set-estrela.png" alt="Set dos DJs">
        </div>
        <a href="../dashboard/criar-post.html" class="botao-criar">+ CRIAR POST</a>
      </div>
    </div>

    <div class="grade">
      <div class="coluna-esquerda">
        <div class="caixa-grafico">
          <canvas id="grafico-barras-generos"></canvas>
        </div>

        <div class="caixa-grafico">
          <canvas id="grafico-rosca-interacoes"></canvas>
        </div>
      </div>

      <div class="coluna-direita">
        <div class="numeros">

          <div class="card-numero">
            <img src="../assets/icon/estrela-icon.png" alt="estrelas">
            <div>
              <div class="numero-valor" id="totalCurtidas">0</div>
              <span class="numero-rotulo">Total Estrelas</span>
            </div>
          </div>

          <div class="card-numero">
            <img src="../assets/icon/usuarios-icon.png" alt="usuarios">
            <div>
              <div class="numero-valor" id="totalUsuarios">0</div>
              <span class="numero-rotulo">Total Usuários</span>
            </div>
          </div>

          <div class="card-numero">
            <img src="../assets/icon/generotop-icon.png" alt="genero">
            <div>
              <div class="numero-valor" id="estiloDestaque" style="font-size: 16px;">---</div>
              <span class="numero-rotulo">Gênero Top</span>
            </div>
          </div>

          <div class="card-numero">
            <img src="../assets/icon/generomenos-icon.png" alt="genero">
            <div>
              <div class="numero-valor" id="generoMenos" style="font-size: 16px;">---</div>
              <span class="numero-rotulo">Gênero Menos Popular</span>
            </div>
          </div>

        </div>

        <div class="card-destaque">
          <img src="../assets/icon/pin-icon.png" alt="post">
          <span id="spanDestaque">POST MAIS ENGAJADO</span>
        </div>

        <div class="card-posts">
          <h3>Posts mais recentes</h3>
          <div class="lista-posts" id="lista_posts_recentes">
          </div>
        </div>

      </div>
    </div>
  </main>

</body>

</html>

<script src="../js/sessao.js"></script>

<script>
  window.onload = function () {
    validarSessao();
    carregarNumeros();
    carregarGraficoBarras();
    carregarGraficoRoscaInteracoes();
    carregarPostsRecentes();
    carregarPostMaisEngajado();
    carregarEstiloDestaque();
  };

  function carregarNumeros() {
    fetch("/dashboard/numeros")
      .then(res => res.json())
      .then(data => {
        document.getElementById("totalCurtidas").innerText = data.totalCurtidas;
        document.getElementById("totalUsuarios").innerText = data.totalUsuarios;
      })
      .catch(err => console.error(err));
  }

  function carregarEstiloDestaque() {
    fetch("/dashboard/generos")
      .then(res => res.json())
      .then(dados => {

        if (dados.length > 0) {

          // MAIS CADASTRADO
          document.getElementById("estiloDestaque").innerText =
            dados[0].estiloMusical;

          // MENOS CADASTRADO
          document.getElementById("generoMenos").innerText =
            dados[dados.length - 1].estiloMusical;
        }
      })
      .catch(err => console.error(err));
  }

  function carregarGraficoBarras() {
    fetch("/dashboard/generos")
      .then(res => res.json())
      .then(dados => {
        const labels = [];
        const valores = [];

        for (let i = 0; i < dados.length; i++) {
          labels.push(dados[i].estiloMusical);
          valores.push(dados[i].total);
        }

        new Chart(document.getElementById('grafico-barras-generos'), {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: 'Quantidade de Fãs',
              data: valores,
              backgroundColor: ['#6cf76c', '#b040d0', '#471396', '#5DF8D8', '#FAE251', '#FF4081']
            }]
          },
          options: {
            scales: {
              y: { beginAtZero: true, ticks: { color: '#ffffff' } },
              x: { ticks: { color: '#ffffff' } }
            },
            plugins: {
              legend: { display: false },
              title: { display: true, text: 'Gêneros Favoritos (Cadastro)', color: '#ffffff' }
            }
          }
        });
      })
      .catch(err => console.error(err));
  }

  function carregarGraficoRoscaInteracoes() {
    fetch("/dashboard/interacoes")
      .then(res => res.json())
      .then(dados => {
        let curtidas = Number(dados.curtidas);
        let comentarios = Number(dados.comentarios);
        let total = curtidas + comentarios;

        let pCurtidas = total > 0 ? ((curtidas / total) * 100).toFixed(1) : 0;
        let pComentarios = total > 0 ? ((comentarios / total) * 100).toFixed(1) : 0;

        new Chart(document.getElementById('grafico-rosca-interacoes'), {
          type: 'doughnut',
          data: {
            labels: [`Curtidas (${pCurtidas}%)`, `Comentários (${pComentarios}%)`],
            datasets: [{
              data: [curtidas, comentarios],
              backgroundColor: ['#b040d0', '#6cf76c'],
              borderWidth: 0
            }]
          },
          options: {
            plugins: {
              legend: { labels: { color: 'white' } },
              title: { display: true, text: `Engajamento Total (Soma: ${total})`, color: 'white' }
            }
          }
        });
      })
      .catch(err => console.error("ERRO NO GRÁFICO:", err));
  }

  function carregarPostsRecentes() {
    fetch("/dashboard/posts-recentes")
      .then(res => res.json())
      .then(posts => {
        const lista = document.getElementById("lista_posts_recentes");
        lista.innerHTML = "";

        if (posts.length > 0){
          for (let i = 0; i < posts.length; i++) {
            let post = posts[i];

            lista.innerHTML += `
                <div class="post">
                    <img src="../assets/uploads/${post.imagemPost}" onerror="this.src='../assets/imgs/dj-default.png'">
                    <div>
                        <strong>${post.titulo}</strong> 
                        <small class="post-texto" style="color: #6cf76c; display: block;">${post.data_post}</small>
                        <span class="post-texto">${post.conteudo.substring(0, 60)}...</span>
                    </div>
                </div>
              `;
          }
        } else {
          lista.innerHTML = "<p style='color:  white;'>Nenhum post encontrado.</p>";
        }
      });
  }

  function carregarPostMaisEngajado() {
    fetch("/dashboard/post-mais-engajado")
      .then(res => res.status === 204 ? null : res.json())
      .then(post => {
        if (!post) return;
        document.getElementById("spanDestaque").innerHTML = `
                POST MAIS ENGAJADO: <br>
                <span style="font-size: 14px; color: #b040d0;">${post.titulo}</span><br>
                <small style="font-size: 12px;">
                   ★ ${post.n_curtidas} estrelas | ${post.n_comentarios} comentários
                </small>
            `;
      });
  }
</script>
